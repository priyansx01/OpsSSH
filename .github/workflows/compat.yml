name: SSH compatibility fixtures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Test disposable SSH and SFTP servers
        shell: pwsh
        run: ./scripts/compat.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-image-versions
          path: artifacts/compat/images.json
