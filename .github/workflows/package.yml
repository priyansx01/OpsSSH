name: Build development packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev
      - run: cargo test --workspace --all-features --locked
      - run: cargo build -p opsssh --release --locked --target ${{ matrix.target }}
      - run: cargo install cargo-about --version 0.9.2 --locked
      - name: Package with license texts and checksum
        shell: pwsh
        run: ./scripts/package.ps1 -Target '${{ matrix.target }}'
      - name: Install MSI build tool
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build branded MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: opsssh-${{ matrix.target }}-unsigned
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.msi
            artifacts/packages/*.tar.gz
            artifacts/packages/*.sha256
          if-no-files-found: error
