name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - name: Linux SSH management helper
        if: runner.os == 'Linux'
        run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 crates/ssh-management/tests/test_helper.py -v
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - name: Record support-code microbenchmark
        shell: bash
        run: |
          mkdir -p artifacts
          cargo run --release -p opsssh --locked -- bench 1000000 > artifacts/support-code-benchmark.json
          cargo run --release -p opsssh --locked -- bench-parser 64 > artifacts/parser-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: support-code-benchmark-${{ matrix.os }}
          path: artifacts/*benchmark.json
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories licenses bans sources
