[package]
name = "opsssh-term-view"
description = "Renderer-independent frame scheduling for OpsSSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
gui = ["dep:gpui", "dep:gpui-component", "dep:opsssh-i18n", "opsssh-platform/gui"]

[dependencies]
opsssh-term-core.workspace = true
opsssh-platform.workspace = true
async-channel.workspace = true
opsssh-ssh-core = { path = "../ssh-core", version = "=0.1.0" }
gpui = { workspace = true, optional = true }
gpui-component = { version = "=0.7.1", optional = true }
opsssh-i18n = { path = "../i18n", version = "=0.1.0", optional = true }

[lints]
workspace = true
