[package]
name = "opsssh-platform"
description = "Platform information and local-terminal interfaces for OpsSSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
gui = ["dep:gpui", "dep:gpui-platform"]
capture = ["gui", "gpui-platform/test-support"]

[dependencies]
opsssh-term-core.workspace = true
portable-pty.workspace = true
directories = "=6.0.0"
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.2", features = ["net"] }
gpui = { workspace = true, optional = true }
gpui-platform = { workspace = true, optional = true }

[lints]
workspace = true
