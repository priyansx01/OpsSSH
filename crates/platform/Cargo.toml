[package]
name = "opsssh-platform"
description = "Platform information and local-terminal interfaces for OpsSSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
gui = ["dep:gpui", "dep:gpui-platform", "dep:raw-window-handle", "dep:async-channel"]
capture = ["gui", "gpui-platform/test-support"]

[dependencies]
opsssh-term-core.workspace = true
portable-pty.workspace = true
directories = "=6.0.0"
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.2", features = ["net"] }
gpui = { workspace = true, optional = true }
gpui-platform = { workspace = true, optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
async-channel = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

# Only keyboard_capture's audited Win32 boundary may use unsafe code.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
