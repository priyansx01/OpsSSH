[package]
name = "opsssh"
description = "Native SSH terminal workspace with server profiles and SFTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui-component", "dep:gpui-kit-assets", "opsssh-platform/gui", "opsssh-term-view/gui"]
capture = ["gui", "gpui/test-support", "opsssh-platform/capture", "opsssh-term-view/test-support"]

[dependencies]
opsssh-platform.workspace = true
opsssh-term-core.workspace = true
opsssh-term-view.workspace = true
gpui = { workspace = true, optional = true }
gpui-component = { version = "=0.7.1", optional = true }
gpui-kit-assets = { version = "=0.7.1", optional = true }
opsssh-store = { path = "../store", version = "=0.1.0" }
opsssh-ssh-config = { path = "../ssh-config", version = "=0.1.0" }
opsssh-ssh-core = { path = "../ssh-core", version = "=0.1.0" }
shlex = "=2.0.1"
opsssh-i18n = { path = "../i18n", version = "=0.1.0" }
opsssh-sftp = { path = "../sftp", version = "=0.1.0" }
opsssh-drop = { path = "../drop", version = "=0.1.0" }
async-channel = "=2.5.0"
tokio = { version = "=1.53.2", features = ["rt", "time", "net"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
