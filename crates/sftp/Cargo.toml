[package]
name = "opsssh-sftp"
description = "Authenticated SFTP browsing and cancellable pipelined transfers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
russh-sftp = "=3.0.1"
