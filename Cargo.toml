[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
opsssh-platform = { path = "crates/platform", version = "=0.1.0" }
opsssh-term-core = { path = "crates/term-core", version = "=0.1.0" }
opsssh-term-view = { path = "crates/term-view", version = "=0.1.0" }
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "=0.9.0"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
async-channel = "=2.5.0"


[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
